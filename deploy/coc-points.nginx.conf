# 放到 /etc/nginx/conf.d/coc-points.conf
# 只服务于 app.jiacheng.cyou, 不影响 jiacheng.cyou (Typecho 博客) 现有配置

server {
    listen 80;
    server_name app.jiacheng.cyou;

    # H5 静态文件 (uni-app `npm run build:h5` 的 dist/build/h5 产物)
    root /var/www/coc-points/h5;
    index index.html;

    # 后端 API 反代到 Node (仅本机 127.0.0.1:3000)
    location /api/ {
        # AI 工坊上传单张图片上限 8MB, 留一点余量给 multipart 边界
        client_max_body_size 9m;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 生图是异步任务 + 前端轮询, 单个请求本身很快; 保留默认超时即可
    }

    # AI 工坊图片目录必须放在静态根目录之外, 且不能被直接访问。
    # 线上实测(AI_STORAGE_DIR=/opt/coc-points/ai-storage)已在 root 之外,
    # 这里显式兜底拒绝, 防止日后误把目录挪进网站根目录。
    # 注意: 宝塔环境的 vhost 在 /www/server/panel/vhost/nginx/coc-points.conf,
    #       改完用: nginx -t && kill -HUP $(cat /www/server/nginx/logs/nginx.pid)
    location ^~ /ai-storage/ {
        deny all;
        return 404;
    }

    # 前端路由 (hash 模式也兼容)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
